name: Build

# pull_request: no base-branch filter — GitHub's default types are
# opened/synchronize/reopened (not edited). Filtering to only
# CarrierHasArrived_single_board skipped the OTA retarget force-push
# while the PR still targeted main; changing the base alone does not
# re-run Actions. Unfiltered pull_request keeps PR builds reliable.
on:
  push:
    branches:
      - CarrierHasArrived_single_board
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '9-2019-q4'

    # 16 KiB UART IAP bootloader @ 0x08000000 (first ST-Link install)
    - name: Build IAP bootloader
      run: make -C Bootloader

    # Carrier SoftAP / UART OTA app @ 0x08004000 (matches Inc/config.h VARIANT_USART)
    - name: Build USART app (OTA image)
      run: make -e VARIANT=VARIANT_USART

    # SoftAP OTA uploads the relocated app .bin (POST /update-board); not phone-OTA.
    # Bootloader .bin is for one-time ST-Link install alongside the app.
    - name: Upload foc-usart-ota app image
      uses: actions/upload-artifact@v4
      with:
        name: foc-usart-ota
        path: |
          build/hover.bin
          build/hover.hex
          build/hover.elf
        retention-days: 30
        if-no-files-found: error

    - name: Upload foc-iap-bootloader
      uses: actions/upload-artifact@v4
      with:
        name: foc-iap-bootloader
        path: |
          Bootloader/build/bootloader.bin
          Bootloader/build/bootloader.elf
        retention-days: 30
        if-no-files-found: error

    # Multi-variant coverage (linker layout is shared with the OTA app)
    - name: PlatformIO Install
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: PlatformIO Run
      run: pio run

    - name: Upload PlatformIO build outputs
      uses: actions/upload-artifact@v4
      with:
        path: ${{github.workspace}}/.pio/build/**
        name: ${{github.event.repository.name}}_pio_${{github.run_number}}
        retention-days: 5
